<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Багрянство | Википедия — Моды</title>
<style>
  :root {
    --bg-dark: #0a0a0c;
    --bg-panel: #131317;
    --bg-hover: #1f1f26;
    --red-accent: #a80000;
    --red-bright: #ff3333;
    --text-main: #e6e6e6;
    --text-muted: #8a8a96;
    --border: #2a2a35;
    --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
  body { 
    display: flex; 
    height: 100vh; 
    background: var(--bg-dark); 
    color: var(--text-main); 
    overflow: hidden; 
    background-image: radial-gradient(circle at 100% 0%, rgba(168, 0, 0, 0.15) 0%, transparent 40%);
  }

  aside {
    width: 320px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    box-shadow: 5px 0 25px rgba(0,0,0,0.5);
    z-index: 10;
  }
  .sidebar-header {
    padding: 25px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(168,0,0,0.1) 0%, transparent 100%);
  }
  .sidebar-header h1 {
    color: var(--red-bright);
    font-size: 1.5rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
    font-weight: 800;
  }
  .search-box { padding: 15px 20px; border-bottom: 1px solid var(--border); }
  .search-box input {
    width: 100%; padding: 12px 18px; border-radius: 8px;
    background: var(--bg-dark); border: 1px solid var(--border);
    color: var(--text-main); outline: none; transition: 0.3s;
    font-size: 0.95rem;
  }
  .search-box input:focus { 
    border-color: var(--red-bright); 
    box-shadow: 0 0 10px rgba(255, 51, 51, 0.2); 
    background: #000;
  }
  
  .mod-list { flex: 1; overflow-y: auto; padding: 10px 0; }
  .category-title {
    padding: 15px 20px 5px;
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
  }
  .mod-item {
    padding: 12px 20px; cursor: pointer; border-left: 4px solid transparent;
    transition: all 0.2s; display: flex; flex-direction: column; gap: 4px;
  }
  .mod-item:hover { background: var(--bg-hover); border-left-color: var(--red-accent); }
  .mod-item.active { background: rgba(168,0,0,0.15); border-left-color: var(--red-bright); }
  .mod-item .title { font-weight: 600; font-size: 1rem; }
  .mod-item .category { font-size: 0.75rem; color: var(--text-muted); }

  main { flex: 1; overflow-y: auto; padding: 50px 80px; position: relative; }
  .article { max-width: 900px; margin: 0 auto; display: none; animation: slideUp 0.4s ease-out; }
  .article.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .article h2 { font-size: 2.5rem; color: #fff; margin-bottom: 10px; font-weight: 800; letter-spacing: 1px; }
  .meta-info { display: flex; gap: 15px; margin-bottom: 25px; color: var(--text-muted); font-size: 0.9rem; flex-wrap: wrap; }
  .meta-info span { 
    background: var(--bg-panel); padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); 
    display: flex; align-items: center; gap: 6px;
  }
  
  .article .mod-image {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .article h3 { margin: 30px 0 15px; font-size: 1.4rem; color: #fff; border-bottom: 1px solid #333; padding-bottom: 8px; }
  .article p { line-height: 1.8; margin-bottom: 20px; color: #b0b0b8; font-size: 1.05rem; }
  .article ul { margin-left: 20px; margin-bottom: 25px; line-height: 1.8; color: #b0b0b8; font-size: 1.05rem; }
  .article li { margin-bottom: 8px; }
  .article li::marker { color: var(--red-bright); }
  .article code { background: #000; padding: 3px 8px; border-radius: 4px; color: var(--red-bright); font-family: monospace; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--red-accent); }
</style>
</head>

  const modListEl = document.getElementById('modList');
  const articleContainer = document.getElementById('articleContainer');
  const welcomeScreen = document.getElementById('welcome-screen');
  const searchInput = document.getElementById('searchInput');

  function renderList(filterText = "") {
    modListEl.innerHTML = "";
    const filteredMods = modsData.filter(mod => 
      mod.title.toLowerCase().includes(filterText.toLowerCase()) || 
      mod.category.toLowerCase().includes(filterText.toLowerCase())
    );

    const grouped = {};
    filteredMods.forEach(mod => {
      if (!grouped[mod.category]) grouped[mod.category] = [];
      grouped[mod.category].push(mod);
    });

    for (const [category, mods] of Object.entries(grouped)) {
      const catHeader = document.createElement('div');
      catHeader.className = 'category-title';
      catHeader.textContent = category;
      modListEl.appendChild(catHeader);

      mods.forEach(mod => {
        const div = document.createElement('div');
        div.className = 'mod-item';
        div.dataset.id = mod.id;
        div.innerHTML = `
          <span class="title">${mod.title}</span>
          <span class="category">${mod.version}</span>
        `;
        div.addEventListener('click', () => openArticle(mod.id, div));
        modListEl.appendChild(div);
      });
    }
  }

  function openArticle(id, clickedElement) {
    document.querySelectorAll('.mod-item').forEach(el => el.classList.remove('active'));
    if (clickedElement) clickedElement.classList.add('active');

    welcomeScreen.style.display = 'none';
    
    const mod = modsData.find(m => m.id === id);
    if (!mod) return;

    const featuresHtml = mod.features ? `<h3>Особенности</h3><ul>${mod.features.map(f => `<li>${f}</li>`).join('')}</ul>` : '';
    const imageHtml = mod.image ? `<img src="${mod.image}" alt="${mod.title}" class="mod-image" onerror="this.style.display='none'">` : '';

    articleContainer.innerHTML = `
      <div class="article active">
        <h2>${mod.title}</h2>
        <div class="meta-info">
          <span>📦 Категория: ${mod.category}</span>
          <span>👤 Автор: ${mod.author}</span>
          <span>⚙️ Версия: ${mod.version}</span>
        </div>
        
        ${imageHtml}
        
        <h3>Подробное описание</h3>
        <p>${mod.description}</p>
        
        ${featuresHtml}
      </div>
    `;
  }

  searchInput.addEventListener('input', (e) => {
    renderList(e.target.value);
  });

  renderList();
</script>
